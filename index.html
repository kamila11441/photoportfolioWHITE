<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#0e0e0e;--muted:#777;--line:#e4e4e4;--tile:#e9e9e9;--f:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;--pad:clamp(1rem,2.6vw,2.2rem)}
@media (prefers-color-scheme:dark){:root{--bg:#0e0e0e;--ink:#f2f2f2;--muted:#8d8d8d;--line:#262626;--tile:#1e1e1e}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:300 1rem/1.6 var(--f);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid currentColor;outline-offset:3px}
img{display:block;width:100%;height:100%;object-fit:cover}
.view{display:none}.view.on{display:block}

/* header */
header{position:fixed;inset:0 0 auto 0;z-index:10;display:flex;justify-content:space-between;align-items:baseline;padding:calc(1rem + env(safe-area-inset-top,0px)) var(--pad) 1rem;mix-blend-mode:difference;color:#fff}
header a{font-weight:500}
header nav a:not(:last-child)::after{content:","}
header nav a{margin-left:.35rem}
header nav a.cur{text-decoration:underline;text-underline-offset:.25em}

/* preloader */
#pre{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:flex-end;justify-content:flex-start;padding:var(--pad);transition:opacity .5s .1s}
#pre.out{opacity:0;pointer-events:none}
#pre b{font-weight:300;font-size:clamp(4rem,18vw,14rem);line-height:.8;letter-spacing:-.05em;font-variant-numeric:tabular-nums}

/* hero */
.hero{position:relative;height:100svh;min-height:30rem;background:var(--tile);color:#fff;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,#0007)}
.hero img{position:absolute;inset:0}
.hero h1{position:absolute;z-index:2;left:var(--pad);bottom:var(--pad);margin:0;font-weight:300;font-size:clamp(2.6rem,9vw,8rem);line-height:.95;letter-spacing:-.04em}
.hero h1 span{display:block;opacity:.85}

/* feed + grid */
.feed{display:grid;gap:clamp(2rem,5vw,4rem);padding:clamp(2rem,5vw,4rem) var(--pad)}
.item{display:block}
.item .ph{background:var(--tile);overflow:hidden;aspect-ratio:var(--r,3/2)}
.item .ph img{transition:transform .6s}
.item:hover .ph img{transform:scale(1.025)}
.item .cap{display:flex;justify-content:space-between;gap:1rem;margin-top:.7rem;font-size:.95rem}
.item .cap span{color:var(--muted)}
.feed .item:nth-child(even){max-width:62%;justify-self:end}
@media (max-width:760px){.feed .item:nth-child(even){max-width:100%}}
.page{padding:calc(5.5rem + env(safe-area-inset-top,0px)) var(--pad) 2rem}
.page>h2{margin:0 0 2rem;font-weight:300;font-size:clamp(2rem,6vw,4.5rem);letter-spacing:-.04em;line-height:1}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(1.5rem,3vw,2.5rem) var(--pad)}
@media (max-width:760px){.grid{grid-template-columns:1fr}}

/* project */
.meta{display:grid;grid-template-columns:1fr 2fr;gap:1rem 3rem;margin-bottom:2rem;color:var(--muted)}
.meta p{margin:0;color:var(--ink);font-size:1.15rem;max-width:36rem}
@media (max-width:760px){.meta{grid-template-columns:1fr}}
.imgs{display:grid;gap:var(--pad)}
.imgs .ph{background:var(--tile);aspect-ratio:3/2;overflow:hidden;display:grid;place-items:center;color:var(--muted)}
.next{display:flex;justify-content:space-between;margin-top:3rem;padding-top:1rem;border-top:1px solid var(--line);font-size:1.4rem;letter-spacing:-.02em}

/* info / contact */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:2rem 4rem}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.cols p{margin:0 0 1rem;font-size:clamp(1.1rem,2vw,1.45rem);line-height:1.45;max-width:36rem}
.pt{aspect-ratio:4/5;background:var(--tile);overflow:hidden;margin-bottom:1.5rem;max-width:26rem}
h3{margin:1.5rem 0 .4rem;font-size:.85rem;font-weight:500;color:var(--muted)}
ul{list-style:none;margin:0;padding:0}
.big{font-size:clamp(1.6rem,6vw,4.5rem);letter-spacing:-.04em;line-height:1.05;display:inline-block;overflow-wrap:anywhere;border-bottom:1px solid currentColor}
footer{padding:2rem var(--pad) calc(2rem + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem;color:var(--muted);font-size:.9rem}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>
<body>
<div id="pre" aria-hidden="true"><b><span id="pn">0</span>%</b></div>

<header>
  <a href="#home" id="logo"></a>
  <nav><a href="#works" data-h="works">Works</a><a href="#info" data-h="info">Info</a><a href="#contact" data-h="contact">Contact</a></nav>
</header>

<main>
  <section class="view" id="v-home">
    <div class="hero"><div id="heroImg"></div><h1 id="heroName"></h1></div>
    <div class="feed" id="feed"></div>
  </section>
  <section class="view" id="v-works"><div class="page"><h2>Works</h2><div class="grid" id="grid"></div></div></section>
  <section class="view" id="v-project"><div class="page" id="proj"></div></section>
  <section class="view" id="v-info"><div class="page"><h2>Info</h2><div class="cols" id="info"></div></div></section>
  <section class="view" id="v-contact"><div class="page"><h2>Contact</h2><div id="contact"></div></div></section>
</main>

<footer><span id="fl"></span><a href="#home">Back to top ↑</a></footer>

<script src="content.js"></script>
<script>
const S = window.SITE, $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const img = (src, alt) => src ? `<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy">` : "";
const ph = (src, alt, ratio, n) => `<div class="ph" style="${ratio ? `--r:${ratio}` : ""}">${src ? img(src, alt) : (n ? `<span>${n}</span>` : "")}</div>`;
const P = S.projects;

document.title = S.name; document.documentElement.lang = "en";
let m = document.querySelector('meta[name=description]') || document.head.appendChild(Object.assign(document.createElement("meta"), {name:"description"}));
m.content = S.description;
$("#logo").innerHTML = S.logoImg ? `<img src="${esc(S.logoImg)}" alt="${esc(S.name)}" style="height:1.4rem;width:auto">` : esc(S.logo);
$("#fl").textContent = `© ${new Date().getFullYear()} ${S.name}`;

/* home */
$("#heroImg").innerHTML = img(S.hero, S.name);
$("#heroName").innerHTML = esc(S.name) + S.titleLines.map(t => `<span>${esc(t)}</span>`).join("");
const card = p => `<a class="item" href="#p/${p.id}">${ph(p.cover, p.title, p.ratio)}<div class="cap">${esc(p.title)}<span>${esc(p.client || "")} ${p.year || ""}</span></div></a>`;
$("#feed").innerHTML = P.map(card).join("");
$("#grid").innerHTML = P.map(card).join("");

/* info + contact */
const I = S.info, C = S.contact;
$("#info").innerHTML = `
  <div>${I.portrait ? `<div class="pt">${img(I.portrait, S.name)}</div>` : ""}${I.paragraphs.map(t => `<p>${esc(t)}</p>`).join("")}</div>
  <div><h3>Clients</h3><ul>${I.clients.map(c => `<li>${esc(c)}</li>`).join("")}</ul>
  <h3>Awards and press</h3><ul>${I.awards.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>`;
$("#contact").innerHTML = `
  <a class="big" href="mailto:${esc(C.email)}">${esc(C.email)}</a>
  <h3>Phone</h3><p>${esc(C.phone)}</p>
  <h3>Based in</h3><p>${esc(C.location)}</p>
  ${C.rep ? `<h3>Representation</h3><p>${esc(C.rep)}</p>` : ""}
  <h3>Social</h3><ul>${C.social.map(s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)} ↗</a></li>`).join("")}</ul>`;

/* routing: #home  #works  #info  #contact  #p/<project-id> */
function route() {
  const h = (location.hash || "#home").slice(1), [a, id] = h.split("/");
  const view = a === "p" ? "project" : ["works","info","contact"].includes(a) ? a : "home";
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + view));
  document.querySelectorAll("header nav a").forEach(l => l.classList.toggle("cur", l.dataset.h === view || (view === "project" && l.dataset.h === "works")));
  if (view === "project") {
    const i = Math.max(0, P.findIndex(p => p.id === id)), p = P[i], nx = P[(i + 1) % P.length];
    $("#proj").innerHTML = `<h2>${esc(p.title)}</h2>
      <div class="meta"><span>${esc(p.client || "")} ${p.year || ""}</span><p>${esc(p.text || "")}</p></div>
      <div class="imgs">${p.images.map((s, k) => ph(s, p.title + " " + (k + 1), "", String(k + 1).padStart(2, "0"))).join("")}</div>
      <a class="next" href="#p/${nx.id}"><span>Next</span><span>${esc(nx.title)} →</span></a>`;
  }
  scrollTo(0, 0);
}
addEventListener("hashchange", route); route();

/* preloader: counts once per visit, skipped for reduced motion */
const pre = $("#pre"), seen = (() => { try { return sessionStorage.getItem("seen"); } catch (e) { return 1; } })();
if (seen || matchMedia("(prefers-reduced-motion:reduce)").matches) pre.remove();
else {
  let n = 0; const t = setInterval(() => { n += Math.ceil(Math.random() * 9); if (n >= 100) { n = 100; clearInterval(t); setTimeout(() => { pre.classList.add("out"); setTimeout(() => pre.remove(), 700); }, 150); } $("#pn").textContent = n; }, 45);
  try { sessionStorage.setItem("seen", 1); } catch (e) {}
}
</script>
</body>
</html>
